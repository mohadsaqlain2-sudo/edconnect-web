<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
    <title>You are offline · EduConnect</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #5b6478;
            --border: #dbe1ee;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1020;
                --surface: #131a2e;
                --text: #e8edf7;
                --muted: #a4aec4;
                --border: #263149;
                --primary: #818cf8;
                --primary-dark: #a5b4fc;
            }
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
            line-height: 1.6;
            text-align: center;
            -webkit-text-size-adjust: 100%;
        }

        main {
            width: min(30rem, 100%);
            padding: clamp(1.5rem, 1rem + 3vw, 2.75rem);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            background: var(--surface);
            box-shadow: 0 18px 45px -18px rgba(15, 23, 42, 0.35);
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4.5rem;
            height: 4.5rem;
            margin-bottom: 1rem;
            border-radius: 50%;
            background: color-mix(in srgb, var(--primary) 14%, transparent);
            font-size: 2rem;
        }

        h1 { font-size: clamp(1.3rem, 1.1rem + 1vw, 1.75rem); margin: 0 0 0.5rem; }

        p { margin: 0 0 1rem; color: var(--muted); }

        .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 1.25rem; }

        a, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.6rem 1.1rem;
            border-radius: 0.65rem;
            border: 1px solid transparent;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .primary { background: var(--primary); color: #fff; }
        .primary:hover, .primary:focus-visible { background: var(--primary-dark); }
        .secondary { background: transparent; color: var(--text); border-color: var(--border); }

        :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

        .status { min-height: 1.5rem; margin-top: 0.9rem; font-size: 0.85rem; color: var(--muted); }

        @media (prefers-reduced-motion: no-preference) {
            main { animation: rise 260ms ease-out both; }
            @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
        }
    </style>
</head>
<body>
    <main>
        <span class="icon" aria-hidden="true">📡</span>
        <h1>You are offline</h1>
        <p>
            EduConnect cannot reach the internet right now. Pages you already opened
            may still work. Your draft is kept in this browser, so nothing is lost.
        </p>

        <div class="actions">
            <button type="button" class="primary" id="retry">Try again</button>
            <a class="secondary" href="/">Go to the home page</a>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        (function () {
            var status = document.getElementById('status');

            function check() {
                status.textContent = navigator.onLine
                    ? 'You are back online. Retrying…'
                    : 'Still offline. Check Wi-Fi or mobile data.';
            }

            document.getElementById('retry').addEventListener('click', function () {
                check();

                if (navigator.onLine) {
                    window.location.reload();
                }
            });

            window.addEventListener('online', check);
            window.addEventListener('offline', check);
        })();
    </script>
</body>
</html>
